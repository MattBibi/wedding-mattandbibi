<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><style>
/* Three quick chuckles, followed by a long quiet perch. Feet stay still. */
.laugh-head{transform-origin:79px 76px;animation:kookaburra-laugh 16s ease-in-out infinite}
.laugh-jaw{transform-origin:59px 57px;animation:kookaburra-jaw 16s ease-in-out infinite}
.mouth{opacity:0;animation:kookaburra-mouth 16s linear infinite}
.laugh-eye{transform-origin:65px 51px;animation:kookaburra-eye 16s ease-in-out infinite}
@keyframes kookaburra-laugh{0%,14%,31%,100%{transform:rotate(0)}17%,21%,25%{transform:rotate(16deg)}19%,23%,27%{transform:rotate(7deg)}}
@keyframes kookaburra-jaw{0%,15%,19%,23%,28%,100%{transform:rotate(0)}17%,21%,25%{transform:rotate(-30deg)}}
@keyframes kookaburra-mouth{0%,15%,19%,23%,28%,100%{opacity:0}17%,21%,25%{opacity:1}}
@keyframes kookaburra-eye{0%,14%,30%,100%{transform:scaleY(1)}17%,21%,25%{transform:scaleY(.35)}19%,23%,27%{transform:scaleY(.8)}}
@media(prefers-reduced-motion:reduce){.laugh-head,.laugh-jaw,.mouth,.laugh-eye{animation:none!important}}
</style><path d="M14 132q67-13 134-8" stroke="#9d7751" stroke-width="6" fill="none" stroke-linecap="round"/><path d="m90 91 25 48-17-3-22-37" fill="#6d5344" stroke="#cfac7b"/><path d="m93 108 12 8m-7 1 12 8" stroke="#d8c5a0" stroke-width="3"/><ellipse cx="80" cy="88" rx="24" ry="31" fill="#d7c6a2" stroke="#977f60"/><path d="M79 73q32 5 21 41-25-5-32-24Z" fill="#736456" stroke="#c0ab89"/><path d="m82 83 13 5m-14 3 13 6m-9 2 10 5" stroke="#90a8a7" stroke-width="4"/><g class="laugh-head"><path d="M56 64q-9-31 14-36 26-7 34 17l-4 28-22 9Z" fill="#efe0c0" stroke="#ad9575"/><path d="m57 35 8-14 3 11 9-12 1 12" fill="#e3d5b7" stroke="#b9a180"/><path d="m60 49 38 2-2 9-35-3Z" fill="#59493f"/><circle class="laugh-eye" cx="65" cy="51" r="3" fill="#171c20"/><circle cx="64" cy="50" r="1" fill="white"/><path class="mouth" d="M59 54 22 57 57 72Z" fill="#63362d"/>
<path d="M59 49 20 56l39 2Z" fill="#a18c70" stroke="#5e5347"/>
